spring.application.name=Notaria_Exagonal

# === BASE DE DATOS MYSQL ===
spring.datasource.url=jdbc:mysql://localhost:3306/notaria_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === SERVIDOR ===
server.port=8080

# === JWT ===
jwt.secret=notariaExagonalSecretKey2024SuperSeguraParaHMACSHA256AquiVa
jwt.expiration=86400000

# === SWAGGER ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html